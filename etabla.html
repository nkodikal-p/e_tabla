<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>eTabla</title>
</head>

<body>
  
        <script src="apps.js"></script>

    <br>
    
    <img src="images/tablas.jpg" alt="eTabla">

    <br>

             <h3> Taal</h3>
   
    <!-- Taal selection dropdown -->
    <select id="taalSelect">
        <!-- Options will be populated by JavaScript -->
    </select>
    <br>
        <div id="taaldisplay">
            <div id="taal">
            <!-- Score will be populated by JavaScript -->
            </div>
        </div>
        <!-- Display the matra index while playing -->
        <div id="mindexDisplay"> </div>

        <div id="taaldisplay">
            <!-- Play Taal button-->
            <button class="modern-button" id="playTaalButton">Play</button>

            <!--  Stop button -->
            <button class="modern-button red" id="stopTaalButton">Stop</button>
        
        </div>
    <!-- Set bpm -->
     <div id="bpmDisplay"> 
    
        <button class="bpm-button" id="decreaseBpmButton">-5</button>
        <input type="number" id="bpm" placeholder="BPM" value="80" min="1" max="300">
        <button class="bpm-button" id="increaseBpmButton">+5</button>
    </div>
    <label for="bpm">Tempo</label>

    <br>
    
    <div>
        <label for="keySelect">Key:</label>
        <select id="keySelect">
            <option value="C">C</option>
            <option value="G#">G#</option>
        </select>
    </div>



</body>

</html>
